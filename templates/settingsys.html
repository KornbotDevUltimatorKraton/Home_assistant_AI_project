<script type="text/javascript">
  function fetching_switch(room,status){
       console.log("Argument",room,status);          
       fetch('/Manualswitch', {

          // Declare what type of data we're sending
       headers: {
           'Content-Type': 'application/json'
       },

       // Specify the method
       method: 'POST',
       // A JSON payload
       body: JSON.stringify({
            "Room":room,"status": status
       })
       }).then(function (response) { // At this point, Flask has printed our JSON
       return response.text();
        }).then(function (text) {
           console.log('POST response: ');
           // Should be 'OK' if everything was successful
           console.log(text);
        });
  }
  function Sensordata(){
     window.location.href = "https://192.168.50.55:5899/Sensordashboard";

    window.location.href = "https://192.168.50.55:5899/";

  }
  function room1(datasw){
        console.log("Switch "+datasw+","+"room1");
        fetching_switch("Room1","sw"+String(datasw)); 
  }
